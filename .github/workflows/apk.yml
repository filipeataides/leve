name: App Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Chave de assinatura (a mesma em todas as versões)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: leve-keystore-v1
      - name: Montar o app
        working-directory: android-app
        run: |
          mkdir -p www
          cp -r ../index.html ../styles.css ../core.js ../app.js ../records.js ../jornada.js ../studio.js ../manifest.webmanifest ../icons ../fonts www/
          npm install --no-audit --no-fund
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#FF7A45' --iconBackgroundColorDark '#FF7A45' --splashBackgroundColor '#F6F1E9' --splashBackgroundColorDark '#121124' || echo "ícones padrão"
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Gerar o APK
        working-directory: android-app/android
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=leve,O=Filipe Ataides,C=BR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../leve.apk
      - name: Publicar o APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: leve. para Android
          body: Toque em leve.apk para baixar e instalar no celular.
          files: leve.apk
          make_latest: true
